<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  column-thumb.mjs 専用の fontconfig 設定。
  同梱フォント（KleeOne-SemiBold.ttf＝縦組み和文）を最優先で読ませつつ、
  eyebrow の欧文（Avenir Next Condensed）などは macOS のシステムフォントに退避する。
  スクリプトが FONTCONFIG_FILE でこのファイルを指す＝実行マシンのフォント環境に依存しない。
-->
<fontconfig>
  <dir prefix="relative">.</dir>
  <dir>/System/Library/Fonts</dir>
  <dir>/System/Library/Fonts/Supplemental</dir>
  <dir>/Library/Fonts</dir>
  <dir>~/Library/Fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>
