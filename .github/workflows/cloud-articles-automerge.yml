name: cloud-articles-automerge

# クラウド定期ルーティン(jp-games)が push する claude/** ブランチを
# 自動で main にマージ → Vercel が本番公開する橋渡し。
# クラウドは GitHub プロキシ制約で main へ直 push できないため、これで
# 「無人でスタート→ライブ公開」まで完結させる。
on:
  push:
    branches:
      - "claude/**"

permissions:
  contents: write

concurrency:
  group: cloud-articles-automerge
  cancel-in-progress: false

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node（og-thumb の sharp 用）
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm ci

      - name: Merge, generate Discover thumbnails, publish
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 成績更新CI等が同時刻に main を進めても落ちないよう、競合時は最新 main で再マージしてリトライ
          pushed=0
          for i in 1 2 3 4 5; do
            git fetch origin main "$BRANCH"
            git reset --hard origin/main
            # 競合なくマージできた時だけ進める（壊れる時は main を進めない＝安全側）
            git merge --no-ff "origin/$BRANCH" -m "Auto-merge $BRANCH into main (cloud jp-games routine)"
            # クラウドは maxres 無しの記事の thumbUrl を空にして渡す。ここで公式サムネから
            # 1280x720 の Discover 用サムネを自前生成する（既存 thumbUrl / maxres 有りは skip）。失敗は非致命。
            node scripts/og-thumb.mjs --all || echo "og-thumb skipped/failed (non-fatal)"
            if ! git diff --quiet; then
              git add -A
              git commit -m "chore(thumb): Discover用サムネを自動生成"
            fi
            if git push origin HEAD:main; then pushed=1; echo "push成功"; break; fi
            echo "push競合 → 最新 main で再マージしてリトライ ($i/5)"
            sleep 3
          done
          if [ "$pushed" != "1" ]; then echo "5回リトライしても push できず" >&2; exit 1; fi
          # 公開済みのクラウドブランチは掃除（失敗は無視）
          git push origin --delete "$BRANCH" || true

      # 公開直後に IndexNow へ即時通知（Bing/Yandex/Naver ほか。Google は非対応で sitemap 側が受け皿）。
      # 鍵ファイル public/<key>.txt とスクリプトは前から用意済みだったが、どのワークフローからも
      # 呼ばれておらず手動運用のままだった（2026-07-30 の監査で判明）。本サイトの勝ち筋は
      # 「試合直後の鮮度（QDF）」なので、無人公開の直後に必ず叩く。
      # Vercel のデプロイ完了を少し待ってから通知する（未デプロイのURLを送っても拾われないため）。
      # 通知の失敗はコンテンツ公開を巻き戻す理由にはならないので非致命扱い。
      - name: Notify IndexNow（新着記事の即時インデックス通知）
        run: |
          sleep 90
          node scripts/ping-indexnow.mjs --latest 5 || echo "IndexNow通知に失敗（非致命）"
