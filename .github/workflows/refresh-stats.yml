name: 選手成績スナップショット自動更新

# MLB公式 Stats API から日本人選手の今季成績＋順位を取り直し、変化があれば
# data/jp-players-stats.json をコミット→push（Vercel が自動デプロイ）。
# サイト本体は API を叩かない方針のまま、編集時取得をCIで「試合がある時間帯だけ毎時」実行して
# 鮮度を上げる（規約§4.1：恒常データ源にしない＝デッドな時間帯は回さない）。
# 値が変わらなければ no-op でコミットしない（スナップショットは安定ソートで byte 一致）。

on:
  schedule:
    # 試合がある時間帯(JST 01:00〜17:00頃＝UTC 16:00〜08:00)だけ毎時。:17 は最混雑の毎時0分を避けるため。
    # GitHubのcronはUTC・ベストエフォート（多少遅れることがある）。デッドな時間帯(US午前)は回さない。
    - cron: '17 0-8,16-23 * * *'
  workflow_dispatch: {} # 手動実行も可（オフ時間に即更新したいとき）

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # スクリプトは Node 組み込み(fs/path)＋global fetch のみ。依存インストール不要

      - name: スナップショット取得（asOf/シーズンは JST 基準）
        run: |
          set -euo pipefail
          ASOF=$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')
          SEASON=$(TZ=Asia/Tokyo date +%Y)
          # pipefail で node の失敗が tail に飲まれず赤くなる（取得失敗を no-op と誤認しない）
          node scripts/fetch-mlb-stats.mjs snapshot "$ASOF" "$SEASON" | tail -3

      - name: 全選手の試合別ログ＋WAR推移を更新（徹底分析セクションを全選手へ展開）
        run: |
          set -euo pipefail
          SEASON=$(TZ=Asia/Tokyo date +%Y)
          # gamelogs は snapshot の MLBロースター級 全選手の試合別ログを取り直しつつ、毎時の累計WARを
          # warHistory に1点 upsert（自前の推移を積む）。WAR は snapshot の saber を流用＝API を節約。
          # 失敗してもスナップショットの更新は活かす（|| true せず可視化、ただし続行）。
          node scripts/fetch-mlb-stats.mjs gamelogs "$SEASON" | tail -3 || echo "gamelogs 取得スキップ（snapshot は反映済み）"

      - name: WARレースを更新（大谷＋ライバルの累計WARを1日1点 積む）
        run: |
          set -euo pipefail
          # snapshot を読んで war-race.json に当日の点を upsert（API は叩かない）。失敗しても他は活かす。
          node scripts/fetch-mlb-stats.mjs warrace | tail -2 || echo "warrace スキップ（snapshot は反映済み）"

      - name: 地区順位表を更新（チームLPの順位表用・statsapi 1コール）
        run: |
          set -euo pipefail
          # 勝敗が動かない時間帯は内容一致＝asOf 据え置きで byte 一致 no-op。失敗しても他は活かす。
          ASOF=$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')
          SEASON=$(TZ=Asia/Tokyo date +%Y)
          node scripts/fetch-mlb-stats.mjs standings "$ASOF" "$SEASON" | tail -2 || echo "standings スキップ（既存JSONを保持）"

      - name: 全試合の結果を更新（チームLPの試合タイムライン用・statsapi 1コール）
        run: |
          set -euo pipefail
          # チームLPのタイムラインは「まとめ記事のある試合」でなく**全試合**を並べる（2026-08-07）。
          # 直近30日の確定試合を取り直す。試合が増えていない時間帯は内容一致＝バイト一致 no-op。
          ASOF=$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')
          SEASON=$(TZ=Asia/Tokyo date +%Y)
          node scripts/fetch-mlb-stats.mjs team-games "$ASOF" "$SEASON" | tail -2 || echo "team-games スキップ（既存JSONを保持）"

      - name: 観測日誌の「次の見どころ」を埋め直す（期限切れだけ・公式スケジュールの事実のみ）
        run: |
          set -euo pipefail
          # nextJa は「人が編集セッションで書く」運用だったため、書き手が思い出さないと期限切れ→
          # journalNext がブロックごと落とす→選手LPの末尾が消える、が繰り返した（2026-08-26 に11人中7人）。
          # 既定モードは **期限切れ・未設定の日誌にしか触らない**＝手書きの予告が生きている間は no-op
          # （スケジュールAPIも叩かない）。時刻の完全一致ゲートは付けない（cy-young ボードのドリフト事故
          # と同じ轍を踏まない＝毎時どの分に発火しても、期限が切れた最初の1回で必ず拾う）。
          node scripts/journal-next.mjs | tail -5 || echo "journal-next スキップ（既存の予告を保持）"

      - name: 投手データ（球種＋サイヤング予測）＋MVP予測ボードを1日1回だけ更新
        run: |
          set -euo pipefail
          # このリポの GitHub ネイティブ cron は不発（毎時ジョブは cron-job.org の workflow_dispatch で駆動）。
          # なので日次の投手/MVPデータ更新は独立 schedule でなく、確実に回るこの毎時ジョブに相乗りさせる。
          # ⚠️ 以前は「UTC 08時台の実行のときだけ」という時刻の完全一致で判定していたが、外部トリガーの
          # 発火時刻がドリフトしてUTC 08時台に一度も当たらなくなり、cy-young/mvp/pitch-arsenals の3ボードが
          # 2026-07-27を最後に10日以上静止する事故が発生（2026-08-06発覚）。時刻一致でなく「今日まだ
          # 更新していないか」で判定する自己修復ゲートに変更＝毎時ジョブがどの分・時に実行されても、
          # 前日の試合が確定した後の最初の1回で必ず拾える。
          CURRENT_HOUR_UTC=$((10#$(date -u +%H)))
          if [ "$CURRENT_HOUR_UTC" -lt 8 ]; then
            echo "投手/MVPデータ更新は UTC 8時以降のみ（前日のMLB全試合が確定=ET4時後・現在 ${CURRENT_HOUR_UTC} UTC）→ スキップ"
            exit 0
          fi
          TODAY_JST=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          LAST_ASOF_DATE=$(grep -o '"asOf": *"[0-9-]*' data/cy-young-board.json | head -1 | grep -o '[0-9-]*$' || echo "")
          if [ "$LAST_ASOF_DATE" = "$TODAY_JST" ]; then
            echo "本日分は更新済み（asOf日付=${LAST_ASOF_DATE}）→ スキップ"
            exit 0
          fi
          SEASON=$(TZ=Asia/Tokyo date +%Y)
          # cyyoung を先に（arsenal がボード上位5名を詳細ページ用に取り込むため）。失敗しても他は活かす。
          node scripts/fetch-mlb-stats.mjs cyyoung "$SEASON" | tail -2 || echo "cyyoung スキップ"
          node scripts/fetch-mlb-stats.mjs arsenal "$SEASON" | tail -2 || echo "arsenal スキップ（cyyoung は反映済み）"
          # mvp は statsapi 規定打者＋sabermetrics WAR＋Savant 野手CSV から MVP予測ボードを組む（打者版）。
          node scripts/fetch-mlb-stats.mjs mvp "$SEASON" | tail -2 || echo "mvp スキップ（他ボードは反映済み）"
          node scripts/fetch-mlb-stats.mjs roy "$SEASON" | tail -2 || echo "roy スキップ（他ボードは反映済み）"

      - name: 変化があればコミット＆push
        run: |
          set -euo pipefail
          if git diff --quiet -- data/jp-players-stats.json data/gamelogs/ data/war-race.json data/pitch-arsenals.json data/cy-young-board.json data/mvp-board.json data/roy-board.json data/standings.json data/team-games.json data/player-journal/; then
            echo "変化なし＝コミットしない（no-op）"
            exit 0
          fi
          git config user.name "stats-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jp-players-stats.json data/gamelogs/ data/war-race.json data/pitch-arsenals.json data/cy-young-board.json data/mvp-board.json data/roy-board.json data/standings.json data/team-games.json data/player-journal/
          git commit -m "chore(stats): 選手成績スナップショット自動更新 ($(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST'))"
          # 記事の自動マージ等が同時刻に main を進めても落ちないよう、競合時は rebase してリトライ
          for i in 1 2 3 4 5; do
            if git push; then echo "push成功"; exit 0; fi
            echo "push競合 → fetch & rebase してリトライ ($i/5)"
            git pull --rebase origin main
          done
          echo "5回リトライしても push できず" >&2
          exit 1
