name: 選手成績スナップショット自動更新

# MLB公式 Stats API から日本人選手の今季成績＋順位を取り直し、変化があれば
# data/jp-players-stats.json をコミット→push（Vercel が自動デプロイ）。
# サイト本体は API を叩かない方針のまま、編集時取得をCIで「試合がある時間帯だけ毎時」実行して
# 鮮度を上げる（規約§4.1：恒常データ源にしない＝デッドな時間帯は回さない）。
# 値が変わらなければ no-op でコミットしない（スナップショットは安定ソートで byte 一致）。

on:
  schedule:
    # 試合がある時間帯(JST 01:00〜17:00頃＝UTC 16:00〜08:00)だけ毎時。:17 は最混雑の毎時0分を避けるため。
    # GitHubのcronはUTC・ベストエフォート（多少遅れることがある）。デッドな時間帯(US午前)は回さない。
    - cron: '17 0-8,16-23 * * *'
  workflow_dispatch: {} # 手動実行も可（オフ時間に即更新したいとき）

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # スクリプトは Node 組み込み(fs/path)＋global fetch のみ。依存インストール不要

      - name: スナップショット取得（asOf/シーズンは JST 基準）
        run: |
          set -euo pipefail
          ASOF=$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')
          SEASON=$(TZ=Asia/Tokyo date +%Y)
          # pipefail で node の失敗が tail に飲まれず赤くなる（取得失敗を no-op と誤認しない）
          node scripts/fetch-mlb-stats.mjs snapshot "$ASOF" "$SEASON" | tail -3

      - name: 大谷の試合別ログ＋WAR推移を更新（徹底分析セクション用）
        run: |
          set -euo pipefail
          SEASON=$(TZ=Asia/Tokyo date +%Y)
          # gamelog は試合別ログを取り直しつつ、毎時の累計WARを warHistory に1点 upsert（自前の推移を積む）。
          # 失敗してもスナップショットの更新は活かす（|| true せず可視化、ただし続行）。
          node scripts/fetch-mlb-stats.mjs gamelog 660271 "$SEASON" | tail -2 || echo "gamelog 取得スキップ（snapshot は反映済み）"

      - name: WARレースを更新（大谷＋ライバルの累計WARを1日1点 積む）
        run: |
          set -euo pipefail
          # snapshot を読んで war-race.json に当日の点を upsert（API は叩かない）。失敗しても他は活かす。
          node scripts/fetch-mlb-stats.mjs warrace | tail -2 || echo "warrace スキップ（snapshot は反映済み）"

      - name: 変化があればコミット＆push
        run: |
          set -euo pipefail
          if git diff --quiet -- data/jp-players-stats.json data/gamelogs/ data/war-race.json; then
            echo "変化なし＝コミットしない（no-op）"
            exit 0
          fi
          git config user.name "stats-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jp-players-stats.json data/gamelogs/ data/war-race.json
          git commit -m "chore(stats): 選手成績スナップショット自動更新 ($(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST'))"
          # 記事の自動マージ等が同時刻に main を進めても落ちないよう、競合時は rebase してリトライ
          for i in 1 2 3 4 5; do
            if git push; then echo "push成功"; exit 0; fi
            echo "push競合 → fetch & rebase してリトライ ($i/5)"
            git pull --rebase origin main
          done
          echo "5回リトライしても push できず" >&2
          exit 1
