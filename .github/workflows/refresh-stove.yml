name: ストーブリーグ（FAの動き）自動更新

# /stove-league の「契約の動き」と今季成績を MLB公式 Stats API から取り直し、変化があれば
# data/stove-league-stats.json と data/stove-moves.json をコミット→push（Vercel が自動デプロイ）。
# refresh-stats.yml は冬モードで止まる（オフは試合が無い）が、FAの契約はまさにオフに起きるので別に回す。
# 1回の実行で statsapi 3コール前後（選手まとめて1・取引記録2。新しく出てきた選手がいればその成績ぶん）。
# 中身が変わらなければスクリプトが書かない＝no-op。data/stove-moves.json（移籍情報）も同じ実行で作る。
# 期間は data/stove-league.json の activeUntil まで（過ぎたら何もしない＝翌年のカタログを書くまで休む）。

on:
  schedule:
    # 3時間ごと。契約の発表は米国の日中（JST の深夜〜昼）に集中するが、1日のどこで出ても半日以内に載る間隔。
    - cron: '41 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # 成績CIと同じ枠で直列にする＝同時に main へ push して競合しない。
  group: refresh-stats
  cancel-in-progress: false

jobs:
  stove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Node 組み込み＋global fetch のみ。依存インストール不要

      - name: 期間内か（activeUntil を過ぎたら何もしない）
        id: gate
        run: |
          set -euo pipefail
          TODAY_JST=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          UNTIL=$(node -e "process.stdout.write(require('./data/stove-league.json').activeUntil ?? '')")
          if [ -z "$UNTIL" ] || [[ "$TODAY_JST" > "$UNTIL" ]]; then
            echo "ストーブリーグの期間外（今日 ${TODAY_JST} / 期限 ${UNTIL:-なし}）→ スキップ"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 成績と契約の動きを取得
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          node scripts/fetch-stove-stats.mjs
          # 移籍情報（/stove-league/moves）と球団LPのオフの欄。取引記録1コール＋新しく出てきた選手の成績だけ。
          node scripts/fetch-stove-moves.mjs

      - name: 変化があればコミット＆push
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          # stove-moves.json は新規のこともある（git diff は未追跡のファイルを見ない）＝先に add してから比べる。
          git add data/stove-league-stats.json data/stove-moves.json
          if git diff --cached --quiet; then
            echo "変化なし＝コミットしない（no-op）"
            exit 0
          fi
          git config user.name "stats-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(stove): FAの動きを自動更新 ($(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST'))"
          for i in 1 2 3 4 5; do
            if git push; then echo "push成功"; exit 0; fi
            echo "push競合 → fetch & rebase してリトライ ($i/5)"
            git pull --rebase origin main
          done
          echo "5回リトライしても push できず" >&2
          exit 1
